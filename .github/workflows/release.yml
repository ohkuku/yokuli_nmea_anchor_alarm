name: Publish Anchor Watch Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag; version and channel are derived automatically
        required: true
        type: string

concurrency:
  # Release artifacts are immutable. When a corrected tag supersedes a run,
  # stop the obsolete build instead of spending another emulator allocation.
  group: android-release
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate branch, channel and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      release_channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: metadata
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: bash .github/scripts/resolve_release_metadata.sh
      - name: Enforce release topology
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            case "$RELEASE_CHANNEL" in
              alpha) [[ "$RELEASE_REF" == "refs/heads/codex/develop" || "$RELEASE_REF" == refs/heads/codex/release/* ]] ;;
              beta) [[ "$RELEASE_REF" == refs/heads/codex/release/* || "$RELEASE_REF" == "refs/heads/main" ]] ;;
              stable) [[ "$RELEASE_REF" == "refs/heads/main" ]] ;;
              *) exit 1 ;;
            esac
            exit 0
          fi

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          is_on_branch() {
            git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$1" 2>/dev/null
          }
          is_on_release_branch() {
            while IFS= read -r release_branch; do
              if git merge-base --is-ancestor "$RELEASE_SHA" "$release_branch"; then return 0; fi
            done < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/codex/release/*')
            return 1
          }
          case "$RELEASE_CHANNEL" in
            alpha) is_on_branch codex/develop || is_on_release_branch ;;
            beta) is_on_release_branch || is_on_branch main ;;
            stable) is_on_branch main ;;
            *) exit 1 ;;
          esac

  signing-preflight:
    name: Release signing preflight
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release signing secrets
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-watch-release.jks"
      - name: Validate keystore, alias and private-key password
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/validate_release_signing.sh "$RUNNER_TEMP/anchor-watch-release.jks"

  api36-smoke:
    name: Release API 36 launch smoke
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Android 16 launch and accessibility smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb emu geo fix 174.7633 -36.8485
            bash .github/scripts/run_device_tests.sh smoke
      - name: Expose release API 36 failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Upload release API 36 reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-release-api36-reports-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [validate-release, signing-preflight, api36-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Product identity and free-feature policy guard
        run: bash .github/scripts/product_policy_guard.sh
      - name: Validate release signing secrets
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-watch-release.jks"
      - name: Validate keystore, alias and private-key password
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/validate_release_signing.sh "$RUNNER_TEMP/anchor-watch-release.jks"
      - name: Verify and build signed Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/anchor-watch-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ needs.validate-release.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate-release.outputs.version_code }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature and create checksums
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            > SHA256SUMS.txt
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-${{ needs.validate-release.outputs.release_tag }}-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.validate-release.outputs.release_channel }}
        run: |
          release_files=(
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
            if [ "$RELEASE_CHANNEL" = "stable" ]; then
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "Anchor Watch $RELEASE_TAG" \
                --latest
            else
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "Anchor Watch $RELEASE_TAG" \
                --prerelease
            fi
          else
            prerelease_flag=""
            if [ "$RELEASE_CHANNEL" != "stable" ]; then prerelease_flag="--prerelease"; fi
            gh release create "$RELEASE_TAG" \
              "${release_files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Anchor Watch $RELEASE_TAG" \
              --generate-notes \
              $prerelease_flag
          fi
