name: Publish Anchor Watch Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag, for example v1.0.0
        required: true
        type: string
      version_name:
        description: Android version name, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number
      channel:
        description: Release channel; stable is permitted only from main
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate branch, channel and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce release topology
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          case "$RELEASE_CHANNEL" in
            alpha)
              [[ "$RELEASE_REF" == "refs/heads/codex/develop" || "$RELEASE_REF" == refs/heads/codex/release/* ]]
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
              ;;
            beta)
              [[ "$RELEASE_REF" == refs/heads/codex/release/* || "$RELEASE_REF" == "refs/heads/main" ]]
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
              ;;
            stable)
              [[ "$RELEASE_REF" == "refs/heads/main" ]]
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              ;;
            *) exit 1 ;;
          esac

  device-quality:
    name: Release device-integration gate
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Full device story chain
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb emu geo fix 174.7633 -36.8485
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

  api36-smoke:
    name: Release API 36 launch smoke
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Android 16 launch and accessibility smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb emu geo fix 174.7633 -36.8485
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=com.yokuli.anchorwatch.AppLaunchTest,com.yokuli.anchorwatch.AccessibilityLayoutTest

  publish:
    needs: [device-quality, api36-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Product identity and free-feature policy guard
        run: bash .github/scripts/product_policy_guard.sh
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-watch-release.jks"
      - name: Verify and build signed Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/anchor-watch-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature and create checksums
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          prerelease_flag=""
          if [ "$RELEASE_CHANNEL" != "stable" ]; then prerelease_flag="--prerelease"; fi
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Anchor Watch $RELEASE_TAG" \
            --generate-notes \
            $prerelease_flag
