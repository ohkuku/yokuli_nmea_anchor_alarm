name: Publish Anchor by Yokuli Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag, for example v1.0.0
        required: true
        type: string
      version_name:
        description: Android version name, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: false
        type: boolean

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/anchor-by-yokuli-release.jks"
      - name: Verify and build signed Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/anchor-by-yokuli-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature and create checksums
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag="--prerelease"; fi
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Anchor by Yokuli $RELEASE_TAG" \
            --generate-notes \
            $prerelease_flag
