name: Anchor Watch Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Product identity and free-feature policy guard
        run: bash .github/scripts/product_policy_guard.sh
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Android lint
        id: lint
        continue-on-error: true
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Assemble Debug APK
        id: assemble
        continue-on-error: true
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload quality-gate Debug APK candidate
        if: steps.assemble.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.lint.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-debug-candidate-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload explicitly unverified diagnostic APK
        if: steps.assemble.outcome == 'success' && (steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: UNVERIFIED-anchor-watch-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-build-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Collect build failure diagnostics
        if: always() && (failure() || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        run: bash .github/scripts/collect_failure_bundle.sh build
      - name: Upload downloadable build failure bundle
        if: always() && (failure() || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        uses: actions/upload-artifact@v6
        with:
          name: FAILURE-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/build
          if-no-files-found: error
          retention-days: 30
      - name: Enforce build quality gate
        if: always()
        env:
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
        run: |
          failed=0
          if [ "$UNIT_TEST_RESULT" != "success" ]; then echo "::error::Unit tests failed"; failed=1; fi
          if [ "$LINT_RESULT" != "success" ]; then echo "::error::Android lint failed"; failed=1; fi
          if [ "$ASSEMBLE_RESULT" != "success" ]; then echo "::error::Debug APK compilation failed"; failed=1; fi
          exit "$failed"
      - name: Build test summary
        if: always()
        env:
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
        run: |
          {
            echo "## Anchor Watch build gate"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Unit and accelerated story tests | $UNIT_TEST_RESULT |"
            echo "| Android lint | $LINT_RESULT |"
            echo "| Debug APK | $ASSEMBLE_RESULT |"
            if [ "$UNIT_TEST_RESULT" = success ] && [ "$LINT_RESULT" = success ] && [ "$ASSEMBLE_RESULT" = success ]; then
              echo ""
              echo "Artifact label: **candidate** until all three device shards and the API 36 smoke pass."
            else
              echo ""
              echo "Any diagnostic APK is intentionally labelled **UNVERIFIED**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/test_summary.py app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Device integration tests (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard_index: 0
          - shard: 2
            shard_index: 1
          - shard: 3
            shard_index: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Instrumented integration tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb emu geo fix 174.7633 -36.8485
            bash .github/scripts/run_device_tests.sh shard 3 ${{ matrix.shard_index }}
      - name: Expose instrumented test failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Collect integration failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh integration-shard-${{ matrix.shard }}
      - name: Upload downloadable integration failure bundle
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FAILURE-integration-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/integration-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-integration-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Device-test summary
        if: always()
        run: |
          {
            echo "## Device integration shard ${{ matrix.shard }}/3"
            echo "Includes production-chain stories; one shard also performs the 500,000-sonar-sample streaming backup/restore gate."
          } >> "$GITHUB_STEP_SUMMARY"

  api36-smoke:
    name: Android 16 / API 36 launch smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: API 36 launch and accessibility smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
          LINZ_HYDRO_TILE_TEMPLATE: ${{ secrets.LINZ_HYDRO_TILE_TEMPLATE }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb emu geo fix 174.7633 -36.8485
            bash .github/scripts/run_device_tests.sh smoke
      - name: Expose API 36 smoke failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Collect API 36 failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh api36-smoke
      - name: Upload downloadable API 36 failure bundle
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FAILURE-api36-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/api36-smoke
          if-no-files-found: error
          retention-days: 30
      - name: Upload API 36 smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-api36-smoke-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14

  verified-debug:
    name: Publish fully verified Debug APK
    needs: [build, integration, api36-smoke]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download candidate built by the quality gate
        uses: actions/download-artifact@v6
        with:
          name: anchor-watch-debug-candidate-${{ github.sha }}
          path: verified-apk
      - name: Upload fully verified installable Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-debug-verified-${{ github.sha }}
          path: verified-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling development Debug APK
        if: github.ref == 'refs/heads/codex/develop'
        uses: actions/upload-artifact@v6
        with:
          name: anchor-watch-development-debug-${{ github.run_number }}-${{ github.sha }}
          path: verified-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 45
      - name: Verified artifact summary
        run: |
          {
            echo "## Fully verified Debug APK"
            echo "Unit tests, Android Lint, Debug compilation, all three device-integration shards, and the API 36 smoke passed."
            echo "Download artifact: **anchor-watch-debug-verified-${{ github.sha }}**"
            if [ "${{ github.ref }}" = "refs/heads/codex/develop" ]; then
              echo "Development channel: **anchor-watch-development-debug-${{ github.run_number }}-${{ github.sha }}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect verified-Debug publication failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh verified-debug
      - name: Upload downloadable verified-Debug failure bundle
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FAILURE-verified-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/verified-debug
          if-no-files-found: error
          retention-days: 30
