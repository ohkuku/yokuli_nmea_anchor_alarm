name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and APKs
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmea-anchor-watch-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
  integration:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
      - name: Instrumented integration tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb emu geo fix 174.7633 -36.8485
            ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: app/build/reports/androidTests/**
