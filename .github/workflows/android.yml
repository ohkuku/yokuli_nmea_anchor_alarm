name: Anchor by Yokuli Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and Debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload Debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: anchor-by-yokuli-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-by-yokuli-build-reports
          path: |
            app/build/reports/**
  integration:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
      - name: Instrumented integration tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb emu geo fix 174.7633 -36.8485
            ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-by-yokuli-integration-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: warn
